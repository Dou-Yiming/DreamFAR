<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DreamFAR has moved</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://amazon-far.github.io/dreamfar/">
<script>
/* Moved: https://www.yimingdou.com/DreamFAR/<path>?<query>#<hash> -> https://amazon-far.github.io/dreamfar/<path>?<query>#<hash> */
(function () {
  var rest = location.pathname.replace(/^\/DreamFAR(?=\/|$)/, '').replace(/^\//, '');
  location.replace('https://amazon-far.github.io/dreamfar/' + rest + location.search + location.hash);
})();
</script>
<!-- no-JS fallback. Delay 1 s, not 0: WebKit lets a 0-s refresh replace the already scheduled location.replace() above
     (losing the path, query and #hash); a longer delay is ignored while that navigation is pending. -->
<meta http-equiv="refresh" content="1; url=https://amazon-far.github.io/dreamfar/">
<style>body{font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;max-width:40rem;margin:4rem auto;padding:0 1rem;color:#111}a{color:#0b5fff}</style>
</head>
<body>
<h1>DreamFAR has moved</h1>
<p>The DreamFAR project page now lives at <a id="to" href="https://amazon-far.github.io/dreamfar/">https://amazon-far.github.io/dreamfar/</a>. If you are not redirected automatically, follow the link.</p>
<script>document.getElementById('to').href = document.getElementById('to').textContent = (function () {
  var rest = location.pathname.replace(/^\/DreamFAR(?=\/|$)/, '').replace(/^\//, '');
  return 'https://amazon-far.github.io/dreamfar/' + rest + location.search + location.hash; })();</script>
</body>
</html>
